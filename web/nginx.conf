# nginx-Konfiguration fuer das Longwave-Frontend.
#
# Bewusst schlank: nginx liefert hier nur statische Dateien aus. Das Routing
# zwischen Frontend und Game-Server macht der Ingress (/api -> longwave-server,
# / -> longwave-web), nicht diese Datei.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Zugriffslog nach stdout: der Container schreibt einen Stream, das
    # Einsammeln macht die Plattform (12 Factor XI).
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Alle Schreibpfade nach /tmp, damit das Wurzel-Dateisystem
    # read-only gemountet werden kann (securityContext im Deployment).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Cache-Control ueber eine Variable statt ueber add_header im location-Block:
    # ein add_header in einem verschachtelten Block verwirft ALLE geerbten
    # add_header-Anweisungen des server-Blocks. Da "/" intern auf "/index.html"
    # umgeschrieben wird, waeren so genau auf der Startseite die
    # Sicherheits-Header verloren gegangen.
    map $uri $cache_control {
        default              "public, max-age=300";
        "/"                  "no-cache, must-revalidate";
        "/index.html"        "no-cache, must-revalidate";
    }

    server {
        # Port 8080: unprivilegiert, damit der Container nicht als root laufen muss.
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Ein einziger Header-Satz fuer alle Antworten. "always" gilt auch fuer
        # Fehlerseiten.
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # CSP passt zur Struktur des Frontends: eigene Skript- und Stildateien,
        # WebSocket zum eigenen Origin, sonst nichts. Kein 'unsafe-inline'.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # Eigener Health-Endpunkt fuer die Kubernetes-Probes — ohne Logzeile,
        # sonst besteht das Log fast nur aus Probe-Verkehr.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
